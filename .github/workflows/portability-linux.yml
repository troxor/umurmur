name: Portability Linux
permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - src/**
      - cmake/**
      - CMakeLists.txt
      - hack/**
      - .github/workflows/portability-linux.yml
  pull_request:
    types: [opened, synchronize]
    paths:
      - src/**
      - cmake/**
      - CMakeLists.txt
      - hack/**
      - .github/workflows/portability-linux.yml
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

concurrency:
  group: portability-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config zsh \
            libconfig-dev libprotobuf-c-dev \
            libssl-dev libmbedtls-dev libgnutls28-dev nettle-dev
      - name: Build and test all SSL backends
        run: ./hack/make-all.sh
