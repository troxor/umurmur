name: Portability FreeBSD
permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - src/**
      - cmake/**
      - CMakeLists.txt
      - hack/**
      - .github/workflows/portability-freebsd.yml
  pull_request:
    types: [opened, synchronize]
    paths:
      - src/**
      - cmake/**
      - CMakeLists.txt
      - hack/**
      - .github/workflows/portability-freebsd.yml
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

concurrency:
  group: portability-freebsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: freebsd 14.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test all SSL backends
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: freebsd
          version: "14.4"
          run: |
            sudo pkg install -y cmake gmake pkgconf libconfig protobuf-c mbedtls3 gnutls zsh
            ./hack/make-all.sh
